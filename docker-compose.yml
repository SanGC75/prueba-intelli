services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: prueba_intelli
    volumes:
      - .:/var/www
    networks:
      - laravel_net
    working_dir: /var/www

  nginx:
    image: nginx:alpine
    container_name: prueba_intelli_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - laravel_net

  db:
    image: postgres:15-alpine
    container_name: prueba_intelli_db
    command: ["postgres", "-c", "password_encryption=md5"]
    environment:
      POSTGRES_DB: intelli_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    networks:
      - laravel_net

networks:
  laravel_net:
    driver: bridge
